<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Federal Electric · Private Poker</title><link rel="stylesheet" href="styles.css"></head><body class="poker-window"><div id="pokerModal" class="poker-modal open"><div class="poker-shell"><div class="poker-room-head"><div><small>PRIVATE TABLE · WASHINGTON, D.C. · FEDERAL ELECTRIC SOCIAL BOOK</small><h2 id="pokerRoomName">Private Poker</h2></div><div class="poker-head-actions"><div class="poker-music"><button id="musicToggle" type="button">Music On</button><label>Volume <input id="musicVolume" type="range" min="0" max="100" value="28"></label></div><button onclick="FE_POKER.leave()">Leave Game</button></div></div><div class="poker-table"><div id="pokerSeats"></div><div class="poker-center"><div class="pot-label">POT <b id="pokerPot">$0</b></div><div id="pokerBoard" class="poker-board"></div></div></div><div id="pokerLog" class="poker-log"></div><div id="pokerActions" class="poker-actions"><button onclick="FE_POKER.action('fold')">Fold</button><button id="pokerCall" onclick="FE_POKER.action('call')">Check</button><button onclick="FE_POKER.action('raise')">Raise</button></div><button id="pokerNext" class="poker-next" onclick="FE_POKER.newHand()">Deal Next Hand</button></div></div><audio id="roomMusic" loop preload="auto"></audio><script src="poker.js"></script><script>const q=new URLSearchParams(location.search),room=q.get('room')||'working';
const ROOM_MUSIC={working:{title:'Sidewalk Hustle',src:'audio/sidewalk-hustle.mp3'},middle:{title:'The Foot Tappers Club',src:'audio/the-foot-tappers-club.mp3'},elite:{title:'Dancing in Smoke',src:'audio/dancing-in-smoke.mp3'}};
const roomTrack=ROOM_MUSIC[room],audio=document.getElementById('roomMusic'),musicToggle=document.getElementById('musicToggle'),musicVolume=document.getElementById('musicVolume');
audio.src=roomTrack.src;audio.volume=.28;musicToggle.title=roomTrack.title;
function setMusicLabel(){musicToggle.textContent=audio.paused?'Music Off':'Music On'}
musicToggle.onclick=()=>{if(audio.paused){audio.play().catch(()=>{});}else audio.pause();setMusicLabel()};
musicVolume.oninput=()=>{audio.volume=Number(musicVolume.value)/100};
function beginRoomMusic(){audio.play().then(setMusicLabel).catch(()=>{musicToggle.textContent='Play Music'});document.removeEventListener('pointerdown',beginRoomMusic)}
document.addEventListener('pointerdown',beginRoomMusic,{once:true});
window.FE_POKER_EXIT=(circle,delta,hands)=>{try{window.opener&&window.opener.FE_POKER_RETURN(circle,delta,hands)}catch(e){}window.close()};FE_POKER.start(room);</script></body></html>
