name: Import Federal Electric title music

on:
  push:
    paths:
      - ".github/workflows/import-title-music.yml"

permissions:
  contents: write

jobs:
  import-title-music:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Federal Electric
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact Sunflower Slow Drag recording
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          curl -L --fail --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/3/3d/Scott_Joplin%27s_%22Sunflower_Slow_Drag%22_performed_by_the_United_States_Marine_Band.oga' \
            -o assets/audio/sunflower-slow-drag.ogg
          echo '0832381b1cee47076db2a0c18ac82c8b5bf7f27b  assets/audio/sunflower-slow-drag.ogg' | sha1sum -c -

      - name: Commit title music asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/sunflower-slow-drag.ogg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add Sunflower Slow Drag title music'
          git push origin HEAD:main
